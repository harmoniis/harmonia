[package]
name = "harmonia-transport-pgp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Shared PGP trust-store + signer for Harmonia transport frontends (MQTT, Email, SIP, HTTP/3)"
keywords = ["harmonia", "pgp", "trust"]

[lib]

[dependencies]
async-trait = "0.1"
chrono = "0.4"
hex = "0.4"
pgp = "0.14"
ractor = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

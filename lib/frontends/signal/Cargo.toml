[package]
name = "harmonia-signal"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Signal frontend bridge for the Harmonia agent (signal-cli REST/JSON-RPC)"
keywords = ["harmonia", "signal"]
categories = ["api-bindings"]

[lib]

[dependencies]
harmonia-actor-protocol = { version = "0.1.9", path = "../../core/actor-protocol" }
harmonia-config-store = { version = "0.1.9", path = "../../core/config-store" }
harmonia-vault = { version = "0.1.9", path = "../../core/vault" }
harmonia-frontend-trait = { version = "0.1.0", path = "../shared/frontend-trait" }
async-trait = "0.1"
serde_json = "1"
ureq = { version = "2", features = ["json"] }

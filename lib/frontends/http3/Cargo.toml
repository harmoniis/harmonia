[package]
name = "harmonia-http3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HTTP/3 (QUIC + h3) mTLS frontend for the Harmonia agent"
keywords = ["harmonia", "http3", "quic"]

[lib]

[dependencies]
harmonia-actor-protocol = { version = "0.1.9", path = "../../core/actor-protocol" }
harmonia-config-store = { version = "0.1.9", path = "../../core/config-store" }
harmonia-frontend-trait = { version = "0.1.0", path = "../shared/frontend-trait" }
harmonia-transport-auth = { version = "0.1.9", path = "../../core/transport-auth" }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

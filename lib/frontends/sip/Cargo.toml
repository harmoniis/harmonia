[package]
name = "harmonia-sip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SIP UAC frontend (kamailio over cluster-internal Consul DNS, standard SIP digest auth) for the Harmonia agent"
keywords = ["harmonia", "sip", "kamailio"]

[lib]

[dependencies]
harmonia-actor-protocol = { version = "0.1.9", path = "../../core/actor-protocol" }
harmonia-config-store = { version = "0.1.9", path = "../../core/config-store" }
harmonia-frontend-trait = { version = "0.1.0", path = "../shared/frontend-trait" }
harmonia-vault = { version = "0.1.9", path = "../../core/vault" }
async-trait = "0.1"
md-5 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "net", "sync", "rt-multi-thread", "io-util", "time"] }

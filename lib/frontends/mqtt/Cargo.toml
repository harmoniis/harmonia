[package]
name = "harmonia-mqtt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "MQTT 5 mTLS frontend for the Harmonia agent (VerneMQ-broker-side)"
keywords = ["harmonia", "mqtt"]

[lib]

[dependencies]
harmonia-actor-protocol = { version = "0.1.9", path = "../../core/actor-protocol" }
harmonia-config-store = { version = "0.1.9", path = "../../core/config-store" }
harmonia-frontend-trait = { version = "0.1.0", path = "../shared/frontend-trait" }
harmonia-transport-auth = { version = "0.1.9", path = "../../core/transport-auth" }
harmonia-vault = { version = "0.1.9", path = "../../core/vault" }
async-trait = "0.1"
rumqttc = { version = "0.25", features = ["use-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
